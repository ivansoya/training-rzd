# Сборка под Mac на Apple Silicon (arm64) — второй композ рядом с основным.
#
# Docker Desktop на macOS держит контейнеры в Linux-VM без доступа к Metal:
# внутри контейнера нет ни CUDA, ни MPS. Поэтому здесь всё считает процессор —
# обучение и полуавтоматическая разметка работают, но заметно медленнее, чем на
# nvidia. Ускорение через MPS возможно только запуском сервиса на самом хосте,
# вне докера; такого пути в проекте пока нет.
#
#   docker compose -f docker-compose.mac.yml up -d --build
#   docker compose -f docker-compose.mac.yml down
#
# Имя проекта compose берёт из каталога, поэтому тома здесь те же, что у
# основного файла (training-rzd_pg-data, training-rzd_yolo-data): база и
# снимки общие. Одновременно оба композа не поднять — совпадают имена
# контейнеров и порт 8080.
services:
  db:
    image: postgres:16-alpine
    container_name: yolo-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=app
      - POSTGRES_PASSWORD=app
      - POSTGRES_DB=app
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      # Local-only: DB clients and alembic autogenerate from the host.
      - "127.0.0.1:5432:5432"

  # Dev mail-catcher: every outgoing email lands here (web UI on :8025).
  mailpit:
    image: axllent/mailpit
    container_name: yolo-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    expose:
      - "1025"

  auth:
    build:
      context: ./backend
      dockerfile: auth_svc/Dockerfile
    container_name: yolo-auth
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+psycopg2://app:app@db:5432/app
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - MAIL_FROM=Магистраль ML <no-reply@magistral.local>
      # Address the confirmation links point at (dev server during development).
      - APP_BASE_URL=http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    expose:
      - "5000"

  datasets:
    build:
      context: ./backend
      dockerfile: datasets_svc/Dockerfile
    container_name: yolo-datasets
    restart: unless-stopped
    environment:
      # Report the *real* host drive in the disk meter (see common.config).
      - HOST_STAT_PATH=/hoststat
      - DATABASE_URL=postgresql+psycopg2://app:app@db:5432/app
    depends_on:
      db:
        condition: service_healthy
      # Migrations live in the auth service; wait for it to apply them.
      auth:
        condition: service_started
    volumes:
      - yolo-data:/app/data
      # На macOS это bind в VM: каталог только стат-ится, ничего не читается
      # построчно, так что медленный проброс тут не мешает.
      - ./:/hoststat:ro
    expose:
      - "5000"

  augmentation:
    build:
      context: ./backend
      dockerfile: augment_svc/Dockerfile
    container_name: yolo-augmentation
    restart: unless-stopped
    volumes:
      - yolo-data:/app/data
    expose:
      - "5000"

  training:
    build:
      context: ./backend
      dockerfile: training_svc/Dockerfile
      args:
        # Колёса torch под linux/aarch64 живут на обычном PyPI; индексы
        # download.pytorch.org/whl/* собраны под x86 и этих версий там нет.
        # Обычная aarch64-сборка torch и так без CUDA — ровно что нужно.
        TORCH_INDEX_URL: https://pypi.org/simple
    container_name: yolo-training
    restart: unless-stopped
    # PyTorch DataLoader workers exchange batches through /dev/shm.
    shm_size: "2gb"
    volumes:
      - yolo-data:/app/data
    expose:
      - "5000"
    # Никаких deploy.resources.reservations.devices: nvidia-рантайма на Mac нет,
    # с этим блоком контейнер просто не стартует. Обучение пойдёт на CPU —
    # в UI выбирайте устройство «cpu», список GPU придёт пустым.

  # Полуавтоматическая разметка на CPU. Кодировщик кадра считается секундами,
  # клики после этого мгновенные; берём самый лёгкий вес, чтобы разница не
  # превращала редактор в слайд-шоу.
  autolabel:
    build:
      context: ./backend
      dockerfile: autolabel_svc/Dockerfile
      args:
        TORCH_INDEX_URL: https://pypi.org/simple
        SAM2_BUILD_CUDA: "0"
    container_name: yolo-autolabel
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+psycopg2://app:app@db:5432/app
      - AUTOLABEL_USERS_PER_WORKER=5
      - SAM2_MODEL=sam2.1_hiera_tiny
      - SAM2_DEVICE=cpu
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_started
    volumes:
      - yolo-data:/app/data
    expose:
      - "5000"

  frontend:
    build: ./frontend
    container_name: yolo-frontend
    restart: unless-stopped
    depends_on:
      - auth
      - datasets
      - augmentation
      - training
      - autolabel
    ports:
      - "8080:80"

volumes:
  # Те же имена, что в основном композе: данные общие между сборками.
  yolo-data:
  pg-data:
