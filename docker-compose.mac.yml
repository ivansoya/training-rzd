# Сборка под Mac на Apple Silicon (arm64) — второй композ рядом с основным.
#
# Docker Desktop на macOS держит контейнеры в Linux-VM без доступа к Metal:
# внутри контейнера нет ни CUDA, ни MPS. Поэтому здесь всё считает процессор —
# обучение и полуавтоматическая разметка работают, но заметно медленнее, чем на
# nvidia. Ускорение через MPS возможно только запуском сервиса на самом хосте,
# вне докера; такого пути в проекте пока нет.
#
#   docker compose -f docker-compose.mac.yml up -d --build
#   docker compose -f docker-compose.mac.yml down
#
# Имя проекта compose берёт из каталога, поэтому тома здесь те же, что у
# основного файла (training-rzd_pg-data, training-rzd_yolo-data): база и
# снимки общие. Одновременно оба композа не поднять — совпадают имена
# контейнеров и порт 8080.
services:
  db:
    image: postgres:16-alpine
    container_name: yolo-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=app
      - POSTGRES_PASSWORD=app
      - POSTGRES_DB=app
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      # Local-only: DB clients and alembic autogenerate from the host.
      - "127.0.0.1:5432:5432"

  # Dev mail-catcher: every outgoing email lands here (web UI on :8025).
  mailpit:
    image: axllent/mailpit
    container_name: yolo-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    expose:
      - "1025"

  auth:
    build:
      context: ./backend
      dockerfile: auth_svc/Dockerfile
    container_name: yolo-auth
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+psycopg2://app:app@db:5432/app
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - MAIL_FROM=Магистраль ML <no-reply@magistral.local>
      # Address the confirmation links point at (dev server during development).
      - APP_BASE_URL=http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    expose:
      - "5000"

  datasets:
    build:
      context: ./backend
      dockerfile: datasets_svc/Dockerfile
    # Имя образа задано явно: тот же образ берёт video-worker. Иначе compose
    # собрал бы из одного Dockerfile два разных образа, и пересборка одного
    # сервиса оставляла бы второй на старом коде.
    image: yolo-datasets
    container_name: yolo-datasets
    restart: unless-stopped
    environment:
      # Report the *real* host drive in the disk meter (see common.config).
      - HOST_STAT_PATH=/hoststat
      - DATABASE_URL=postgresql+psycopg2://app:app@db:5432/app
    depends_on:
      db:
        condition: service_healthy
      # Migrations live in the auth service; wait for it to apply them.
      auth:
        condition: service_started
    volumes:
      - yolo-data:/app/data
      # На macOS это bind в VM: каталог только стат-ится, ничего не читается
      # построчно, так что медленный проброс тут не мешает.
      - ./:/hoststat:ro
    expose:
      - "5000"

  # Воркер видео: тот же образ, другая команда. Всё тяжёлое — построение
  # таблицы кадров, копии ступеней 1080p/720p/480p, нарезка на перегоны —
  # делается здесь. Раньше это жило внутри `datasets` обычными потоками и
  # занимало пул gunicorn: пятеро разметчиков на холодном ролике
  # останавливали проект целиком, вместе со списком тасок и сохранением
  # боксов. Кончится CPU тут — API останется отзывчивым, только видео будет
  # готовиться дольше.
  #
  # Очередь лежит в базе, поэтому воркеров можно поднять несколько (или
  # `docker compose up -d --scale video-worker=3`): задача берётся через
  # FOR UPDATE SKIP LOCKED и достаётся ровно одному.
  video-worker:
    build:
      context: ./backend
      dockerfile: datasets_svc/Dockerfile
    image: yolo-datasets
    container_name: yolo-video-worker
    command: ["python", "-m", "datasets_svc.worker"]
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+psycopg2://app:app@db:5432/app
      # Быстрые берут то, чего ждёт живой человек: таблицу кадров только что
      # загруженного ролика и отдельный перегон. Медленный готовит ступени.
      # Пулы не смешиваются — иначе запрос перегона встал бы за копией.
      - VIDEO_FAST_WORKERS=2
      - VIDEO_SLOW_WORKERS=1
      # Как быстро подбираются работы, брошенные упавшим воркером.
      # Дешёвый запрос раз в десять секунд; дольше держать ролик
      # недорезанным незачем.
      - VIDEO_WORKER_REAP=10
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_started
    volumes:
      - yolo-data:/app/data

  augmentation:
    build:
      context: ./backend
      dockerfile: augment_svc/Dockerfile
    container_name: yolo-augmentation
    restart: unless-stopped
    volumes:
      - yolo-data:/app/data
    expose:
      - "5000"

  training:
    build:
      context: ./backend
      dockerfile: training_svc/Dockerfile
      args:
        # Колёса torch под linux/aarch64 живут на обычном PyPI; индексы
        # download.pytorch.org/whl/* собраны под x86 и этих версий там нет.
        # Обычная aarch64-сборка torch и так без CUDA — ровно что нужно.
        TORCH_INDEX_URL: https://pypi.org/simple
    container_name: yolo-training
    restart: unless-stopped
    # PyTorch DataLoader workers exchange batches through /dev/shm.
    shm_size: "2gb"
    volumes:
      - yolo-data:/app/data
    expose:
      - "5000"
    # Никаких deploy.resources.reservations.devices: nvidia-рантайма на Mac нет,
    # с этим блоком контейнер просто не стартует. Обучение пойдёт на CPU —
    # в UI выбирайте устройство «cpu», список GPU придёт пустым.

  # Полуавтоматическая разметка на CPU. Кодировщик кадра считается секундами,
  # клики после этого мгновенные; берём самый лёгкий вес, чтобы разница не
  # превращала редактор в слайд-шоу.
  autolabel:
    build:
      context: ./backend
      dockerfile: autolabel_svc/Dockerfile
      args:
        TORCH_INDEX_URL: https://pypi.org/simple
        SAM2_BUILD_CUDA: "0"
    container_name: yolo-autolabel
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+psycopg2://app:app@db:5432/app
      - AUTOLABEL_USERS_PER_WORKER=5
      - SAM2_MODEL=sam2.1_hiera_tiny
      - SAM2_DEVICE=cpu
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_started
    volumes:
      - yolo-data:/app/data
    expose:
      - "5000"

  frontend:
    build: ./frontend
    container_name: yolo-frontend
    restart: unless-stopped
    depends_on:
      - auth
      - datasets
      - augmentation
      - training
      - autolabel
    ports:
      - "8080:80"

  # Прогон тестов и отчёт на http://localhost:8090. Только для разработки:
  #   docker compose -f docker-compose.mac.yml --profile dev up -d tests
  # Без --profile dev сервис не поднимается — тесты ходят в живой бэкенд.
  tests:
    profiles: ["dev"]
    build: ./tests
    container_name: yolo-tests
    environment:
      - TEST_BASE_URL=http://frontend
      - TEST_DB_DSN=postgresql://app:app@db:5432/app
      - TEST_MAILPIT_URL=http://mailpit:8025
    depends_on:
      - frontend
    volumes:
      # Исходники монтируются, а не копируются: правку теста видно сразу.
      - ./tests:/work/tests
      - ./backend:/work/backend:ro
      - ./frontend:/work/frontend
      # Свои node_modules поверх хозяйских: на маке там бинарники под darwin,
      # в linux-контейнере они не запускаются. Ставятся при первом прогоне.
      - test-node-modules:/work/frontend/node_modules
      # То же для сквозных тестов: пакет Playwright раскатывается сюда
      # из образа, а каталог тестов остаётся чистым.
      - test-e2e-modules:/work/tests/e2e/node_modules
    ports:
      - "127.0.0.1:8090:8090"

volumes:
  # Те же имена, что в основном композе: данные общие между сборками.
  yolo-data:
  pg-data:
  # Зависимости клиента для тестового прогона. Живут отдельно от хозяйских.
  test-node-modules:
  test-e2e-modules:
