# Microservices: backend services share the yolo-data volume; the frontend
# nginx is the single externally exposed port (8080) and routes /api/* to them.
# PostgreSQL holds users/projects/annotations; image binaries stay on the volume.
#
# Этот файл — основной, для машины с nvidia: обучение и полуавтоматическая
# разметка резервируют GPU безусловно. Для разработки на Mac (Apple Silicon)
# рядом лежит docker-compose.mac.yml — тот же набор сервисов на CPU/arm64.
# Правки сервисов нужно вносить в оба файла.
services:
  db:
    image: postgres:16-alpine
    container_name: yolo-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=app
      - POSTGRES_PASSWORD=app
      - POSTGRES_DB=app
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      # Local-only: DB clients and alembic autogenerate from the host.
      - "127.0.0.1:5432:5432"

  # Dev mail-catcher: every outgoing email lands here (web UI on :8025).
  # In prod, point the auth service's SMTP_* env at a real relay instead.
  mailpit:
    image: axllent/mailpit
    container_name: yolo-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    expose:
      - "1025"

  auth:
    build:
      context: ./backend
      dockerfile: auth_svc/Dockerfile
    container_name: yolo-auth
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+psycopg2://app:app@db:5432/app
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - MAIL_FROM=Магистраль ML <no-reply@magistral.local>
      # Address the confirmation links point at (dev server during development).
      - APP_BASE_URL=http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    expose:
      - "5000"

  datasets:
    build:
      context: ./backend
      dockerfile: datasets_svc/Dockerfile
    # Имя образа задано явно: тот же образ берёт video-worker. Иначе compose
    # собрал бы из одного Dockerfile два разных образа, и пересборка одного
    # сервиса оставляла бы второй на старом коде.
    image: yolo-datasets
    container_name: yolo-datasets
    restart: unless-stopped
    environment:
      # Report the *real* host drive in the disk meter (see common.config).
      - HOST_STAT_PATH=/hoststat
      # Owns project data: binaries on the volume, everything else in Postgres.
      - DATABASE_URL=postgresql+psycopg2://app:app@db:5432/app
    depends_on:
      db:
        condition: service_healthy
      # Migrations live in the auth service; wait for it to apply them.
      auth:
        condition: service_started
    volumes:
      - yolo-data:/app/data
      # Read-only bind of a host dir (lives on the same physical drive Docker
      # stores its data on) purely so the service can stat real free space.
      - ./:/hoststat:ro
    expose:
      - "5000"

  # Воркер видео: тот же образ, другая команда. Всё тяжёлое — построение
  # таблицы кадров, копии ступеней 1080p/720p/480p, нарезка на перегоны —
  # делается здесь. Раньше это жило внутри `datasets` обычными потоками и
  # занимало пул gunicorn: пятеро разметчиков на холодном ролике
  # останавливали проект целиком, вместе со списком тасок и сохранением
  # боксов. Кончится CPU тут — API останется отзывчивым, только видео будет
  # готовиться дольше.
  #
  # Очередь лежит в базе, поэтому воркеров можно поднять несколько (или
  # `docker compose up -d --scale video-worker=3`): задача берётся через
  # FOR UPDATE SKIP LOCKED и достаётся ровно одному.
  video-worker:
    build:
      context: ./backend
      dockerfile: datasets_svc/Dockerfile
    image: yolo-datasets
    container_name: yolo-video-worker
    command: ["python", "-m", "datasets_svc.worker"]
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+psycopg2://app:app@db:5432/app
      # Быстрые берут то, чего ждёт живой человек: таблицу кадров только что
      # загруженного ролика и отдельный перегон. Медленный готовит ступени.
      # Пулы не смешиваются — иначе запрос перегона встал бы за копией.
      - VIDEO_FAST_WORKERS=2
      - VIDEO_SLOW_WORKERS=1
      # Как быстро подбираются работы, брошенные упавшим воркером.
      # Дешёвый запрос раз в десять секунд; дольше держать ролик
      # недорезанным незачем.
      - VIDEO_WORKER_REAP=10
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_started
    volumes:
      - yolo-data:/app/data

  # Подготовка данных: графы аугментаций и сборка обучающих наборов.
  dataprep:
    build:
      context: ./backend
      dockerfile: dataprep_svc/Dockerfile
    # Имя образа задано явно: тот же образ берёт dataprep-worker. Иначе
    # compose собрал бы из одного Dockerfile два разных образа, и пересборка
    # одного сервиса оставляла бы второй на старом коде.
    image: yolo-dataprep
    container_name: yolo-dataprep
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+psycopg2://app:app@db:5432/app
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_started
    volumes:
      - yolo-data:/app/data
    expose:
      - "5000"

  # Сборка наборов: занимает ядро на минуты, поэтому живёт отдельно от ручек.
  dataprep-worker:
    build:
      context: ./backend
      dockerfile: dataprep_svc/Dockerfile
    image: yolo-dataprep
    container_name: yolo-dataprep-worker
    command: ["python", "-m", "dataprep_svc.worker"]
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+psycopg2://app:app@db:5432/app
      # Одна полоса: сборка и так упирается в диск, а вторая отняла бы ядро
      # у разметчиков, которые ничего не собирают.
      - DATAPREP_WORKERS=1
      - DATAPREP_REAP=15
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_started
    volumes:
      - yolo-data:/app/data

  # Обучение: ручки тонкие, состояние в базе. Видеокарту этот контейнер не
  # трогает — её держит воркер, и резервировать её здесь значило бы занимать
  # железо процессом, который им не пользуется.
  training:
    build:
      context: ./backend
      dockerfile: training_svc/Dockerfile
      args:
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cu121
    image: yolo-training
    container_name: yolo-training
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+psycopg2://app:app@db:5432/app
      # Живая связь держит поток на всё время висящего ответа. Двадцать
      # четыре — жёсткий потолок мест, восемь оставлены под обычные запросы.
      - GUNICORN_THREADS=48
      - LIVE_RESERVE=8
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_started
    volumes:
      - yolo-data:/app/data
    expose:
      - "5000"

  # Всё, что просит видеокарту: обучение, проверка модели на ролике и счёт
  # признаков кадров для умного деления.
  training-worker:
    build:
      context: ./backend
      dockerfile: training_svc/Dockerfile
      args:
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cu121
    image: yolo-training
    container_name: yolo-training-worker
    command: ["python", "-m", "training_svc.worker"]
    restart: unless-stopped
    # Загрузчик данных обменивается батчами через /dev/shm.
    shm_size: "2gb"
    environment:
      - DATABASE_URL=postgresql+psycopg2://app:app@db:5432/app
      # Веса сети признаков качаются один раз и живут на томе.
      - TORCH_HOME=/app/data/_embed
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_started
    volumes:
      - yolo-data:/app/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Полуавтоматическая разметка: пул процессов с моделями сегментации.
  # Держит том (кадры читает по image_id) и БД (права по сессионной куке).
  autolabel:
    build:
      context: ./backend
      dockerfile: autolabel_svc/Dockerfile
    container_name: yolo-autolabel
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+psycopg2://app:app@db:5432/app
      # Сколько разметчиков живёт на одном процессе с моделью.
      - AUTOLABEL_USERS_PER_WORKER=5
      - SAM2_MODEL=sam2.1_hiera_small
      - SAM2_DEVICE=cuda
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_started
    volumes:
      - yolo-data:/app/data
    expose:
      - "5000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  frontend:
    build: ./frontend
    container_name: yolo-frontend
    restart: unless-stopped
    depends_on:
      - auth
      - datasets
      - dataprep
      - training
      - autolabel
    ports:
      - "8080:80"

  # Прогон тестов и отчёт на http://localhost:8090. Только для разработки:
  #   docker compose --profile dev up -d tests
  # Без --profile dev сервис не поднимается — тесты ходят в живой бэкенд и
  # создают там данные, чему в бою делать нечего.
  tests:
    profiles: ["dev"]
    build: ./tests
    container_name: yolo-tests
    environment:
      - TEST_BASE_URL=http://frontend
      - TEST_DB_DSN=postgresql://app:app@db:5432/app
      - TEST_MAILPIT_URL=http://mailpit:8025
    depends_on:
      - frontend
    volumes:
      # Исходники монтируются, а не копируются: правку теста видно сразу.
      - ./tests:/work/tests
      - ./backend:/work/backend:ro
      - ./frontend:/work/frontend
      # Свои node_modules поверх хозяйских: бинарники в них собраны под
      # платформу разработчика и в linux-контейнере не запускаются.
      - test-node-modules:/work/frontend/node_modules
      # То же для сквозных тестов: пакет Playwright раскатывается сюда
      # из образа, а каталог тестов остаётся чистым.
      - test-e2e-modules:/work/tests/e2e/node_modules
    ports:
      - "127.0.0.1:8090:8090"

volumes:
  # Named volume (ext4 inside the VM) shared by all services — fast I/O and
  # reliable cross-container reads. Survives rebuilds and `down`; `down -v` wipes.
  yolo-data:
  # PostgreSQL data directory; survives rebuilds and `down`, wiped by `down -v`.
  pg-data:
  # Зависимости клиента для тестового прогона. Живут отдельно от хозяйских.
  test-node-modules:
  test-e2e-modules:
