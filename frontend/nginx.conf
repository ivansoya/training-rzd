# API gateway: serves the SPA and routes /api/* to the backend microservices.
# This is the only externally exposed port.
server {
    listen 80;
    server_name _;

    # Адреса сервисов спрашиваются у DNS докера на каждый запрос, а не один
    # раз при старте. Иначе пересозданный контейнер (а compose пересоздаёт и
    # зависимости, когда их описание разошлось с файлом) получает новый IP,
    # nginx помнит старый и отвечает 502 на всё, пока его не перезапустят.
    # Переменная в proxy_pass — единственный способ заставить nginx
    # разрешать имя заново; сам по себе resolver этого не даёт.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $auth      auth:5000;
    set $datasets  datasets:5000;
    set $dataprep  dataprep:5000;
    set $training  training:5000;
    set $autolabel autolabel:5000;

    # allow arbitrarily large dataset / video uploads (0 = no limit)
    client_max_body_size 0;
    client_body_timeout 1800s;

    root /usr/share/nginx/html;
    index index.html;

    # shared proxy settings (inherited by locations that don't redefine them)
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # stream large uploads straight to the service instead of buffering to disk
    proxy_request_buffering off;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;

    # --- Живая связь: одно соединение на вкладку, буферизовать нельзя.
    #     Регулярное правило обязано стоять ВЫШЕ правил по проекту ниже:
    #     nginx проверяет регулярки в порядке объявления. ---
    location ~ ^/api/projects/[^/]+/stream$ {
        proxy_pass http://$training;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
    }

    # --- Подготовка данных: графы аугментаций и обучающие наборы.
    #     Выше правила про import|datasets|... — иначе запрос ушёл бы в
    #     datasets и вернул 404, а в логах dataprep не осталось бы ни строчки.
    #     Заголовок X-Served-By в ответе показывает, кто на самом деле ответил. ---
    location ~ ^/api/projects/[^/]+/(aug|trainsets|dataprep) {
        proxy_pass http://$dataprep;
    }

    # --- Обучение, проверки моделей и очередь видеокарт. ---
    location ~ ^/api/projects/[^/]+/(runs|checks|check-videos) {
        proxy_pass http://$training;
        proxy_buffering off;
    }

    # --- project data lives in the datasets service (it holds both the volume
    #     and the DB). A regex location wins over the /api/projects prefix. ---
    location ~ ^/api/projects/[^/]+/(import|datasets|images|classes|superclasses|tasks|export) {
        proxy_pass http://$datasets;
        # Архив проекта — сотни мегабайт: буферизовать его в память незачем.
        proxy_buffering off;
    }
    location /api/images { proxy_pass http://$datasets; }
    # --- сам ролик: сотни мегабайт одним ответом. Буферизовать его незачем,
    #     а с буферами по умолчанию (8×4k) nginx спуливал бы его во временный
    #     файл целиком, прежде чем отдать первый байт. ---
    location ~ ^/api/tasks/[^/]+/videos/[^/]+/file$ {
        proxy_pass http://$datasets;
        proxy_buffering off;
    }
    # --- перегоны: кусок видео в 120 кадров, 1-3 МБ. Буферов по умолчанию
    #     (8×4k) на такой ответ не хватает, и nginx спуливал каждый перегон
    #     каждого разметчика во временный файл, прежде чем начать отдавать.
    #     Регулярное правило выигрывает у префикса /api/tasks ниже. ---
    location ~ ^/api/tasks/[^/]+/videos/[^/]+/chunks/ {
        proxy_pass http://$datasets;
        proxy_buffering off;
    }
    location /api/tasks  { proxy_pass http://$datasets; }
    # Треки размечаемого видео адресуются сами по себе: правка ключа не должна
    # тащить за собой ни таску, ни ролик в адресе.
    location /api/video-tracks { proxy_pass http://$datasets; }

    # --- auth/core service (sessions, friends, projects, invitations) ---
    location /api/auth        { proxy_pass http://$auth; }
    location /api/friends     { proxy_pass http://$auth; }
    location /api/projects    { proxy_pass http://$auth; }
    location /api/invitations { proxy_pass http://$auth; }

    # --- каталог узлов и личная библиотека графов (вне проектов) ---
    location /api/aug { proxy_pass http://$dataprep; }

    # --- обучение: свои модели, устройства, железо ---
    location /api/models  { proxy_pass http://$training; }
    location /api/gpu     { proxy_pass http://$training; }
    location = /api/health { proxy_pass http://$training; }

    # --- полуавтоматическая разметка (сессии SAM2, прогрев, предсказание) ---
    location /api/auto {
        proxy_pass http://$autolabel;
        # Первый прогрев кадра на холодной модели заметно дольше обычного ответа.
        proxy_read_timeout 600s;
    }

    # --- datasets service (datasets + background jobs + disk usage) ---
    location /api/jobs     { proxy_pass http://$datasets; }
    location /api/storage  { proxy_pass http://$datasets; }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
